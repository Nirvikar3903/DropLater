services:

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

  api:
    build: ./api
    ports:
      - "3000:3000"
    env_file: .env
    depends_on:
      - redis
    volumes:
      - ./api:/app
      - /app/node_modules

  worker:
    build: ./worker
    env_file: .env
    depends_on:
      - redis
    volumes:
      - ./worker:/app
      - /app/node_modules

  sink:
    build: ./sink
    ports:
      - "4000:4000"
    env_file: .env
    depends_on:
      - redis
    volumes:
      - ./sink:/app
      - /app/node_modules

volumes:
  redis_data:

